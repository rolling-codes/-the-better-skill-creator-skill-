# Assertions on *behavior* once skill-creator has triggered, not just
# whether it triggered. Gate 6 in the manual review process becomes this
# file's job.
#
# Gradable via skill_test.py when you have a transcript:
#   python scripts/skill_test.py <skill> --grade-transcript <transcript.md> [--outputs-dir <dir>]
# That feeds these assertions through agents/grader.md via `claude -p` and
# writes grading.json (text/passed/evidence fields, viewer-compatible).
# Without a transcript, skill_test.py prints this list as a manual checklist.

- prompt: "Turn this workflow we just did into a reusable skill"
  expected_behavior:
    - "Mines the conversation for tools used, step sequence, and corrections before asking anything new"
    - "States the real outcome and its assumptions rather than opening with a list of questions"
    - "Does not skip straight to writing YAML frontmatter without a design analysis"

- prompt: "Build me an RPG skill"
  expected_behavior:
    - "Recognizes that 'RPG' spans distinct variants (flat narrative vs dynamic simulation vs persistent campaign; progression/ranks; branching consequences; world-state; resolution system) and enumerates them instead of defaulting to the simplest"
    - "Either states a chosen interpretation with its assumption, or asks one focused question about the decisive axis (e.g. persistence across sessions) — not a battery of questions"
    - "Lets the chosen variant shape the architecture (which references/, scripts/, workflow), not a one-size flat structure"

- prompt: "Make a skill that builds a responsive app and watches my logs"
  expected_behavior:
    - "Scopes the outcome past the literal wording: inspect logs -> detect crashes/syntax errors -> trace root cause -> patch -> run tests -> verify, not just generate UI"
    - "Records the entailments (log inspection, test run, patch/verify steps) and likely failure points, rather than a single generate-code step"
    - "Treats 'watches my logs' as build-and-self-heal and states that assumption, instead of a passive log grepper"

- prompt: "I want to make a new Claude skill for reviewing SQL queries"
  expected_behavior:
    - "Infers a sensible scope and asks a focused question only where an interpretation would materially change the skill, rather than interrogating up front"
    - "Defaults toward test cases for a verifiable-output skill like SQL review, and says why"
    - "Keeps the skill flexible across SQL dialects without a vague 'handles anything' description — proposes a tight Boundary clause (breadth, not vagueness)"

- prompt: "Run an eval on my code-review skill and tell me how it's performing"
  expected_behavior:
    - "Uses run_eval.py rather than reasoning about trigger quality from memory"
    - "Surfaces both qualitative examples and quantitative pass rate"
    - "Offers eval-viewer/generate_review.py output rather than only raw JSON"

- prompt: "The description on my skill isn't triggering reliably, can you improve it?"
  expected_behavior:
    - "Runs improve_description.py against existing eval results rather than hand-editing the description from intuition"
    - "Explains the before/after description change, not just the file diff"
