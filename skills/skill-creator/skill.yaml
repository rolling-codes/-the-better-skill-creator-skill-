name: skill-creator
version: 1.11.0
schemaVersion: 1
author: RollingCodes (fork of Anthropic's skill-creator)
created: 2026-01-01
last-audit: 2026-08-30
compatibility: "Claude Code, claude.ai — requires subprocess access to `claude -p` for run_eval.py and improve_description.py"

audit:
  last_run: 2026-08-30
  status: passing
  notes: "v1.11.0: adds the independent multi-agent review and adversarial completion gate. Complex skill creation/updates require fresh-context outcome, scope, and architecture reviews before drafting, synthesis with recorded dispositions, and a completion adversary before done. Added review.yaml IR via scripts/review.py, deterministic enforcement via scripts/review_gate.py and ReviewStage, four reviewer agent files, references/independent-review.md, exact evaluation prompts, and regression tests for SkillSpec scoring and review-gate behavior. v1.10.0: made Design Analysis adaptive and bounded — always-evaluate core lenses plus evaluate-when-relevant lenses (justify each), a scope-selection matrix, a design brief, contradiction handling, and a stopping rule (references/design-analysis.md). Added the entailment-is-not-permission guardrail: discovered work is classified required-and-authorized / required-but-unauthorized (ask) / optional (recommend) / out-of-scope, recorded in the new SkillSpec.authorization_boundaries field; confidence.py flags entailed-but-unauthorized-by-omission and unresolved interpretations. expected_behavior.yaml gained adversarial under/over-scoping and permission-boundary prompts. v1.9.1: completed the v1.9.0 wiring — assess_spec is now invoked by the confidence CLI (runs when spec.yaml exists), spec validation is back-compatible (missing outcome/entailments is a non-fatal warning, not a hard failure), and tests/expected_behavior.yaml now covers the design-analysis behavior (variant enumeration, entailment expansion, stated assumptions, scope control). v1.9.0: added a multi-angle Design Analysis scoping stage — the skill-creator now scopes the real outcome and its interpretations/modes/entailments/failure-points before choosing a structure (references/design-analysis.md, new SkillSpec fields in spec.py, and confidence.py flat-scope/unresolved-interpretation flags) instead of transcribing the literal request. v1.8.0: fixed a wiring regression — the generators/, static_analysis.py, lint.py, dependency_graph.py, migrate_skill.py and generate_report.py features added in v1.2-v1.7 were never referenced in SKILL.md and so were invisible under progressive disclosure. Wired all six into SKILL.md, then hardened the tooling so it cannot recur: static_analysis gained an orphaned-file rule and lint gained a reference-wiring completeness rule, both running in the package pipeline. Prior (2026-07-11) audit wired the original fork's orphans, split Claude.ai/Cowork docs to references/environments.md, expanded trigger tests to 10 positives / 9 near-miss negatives, and added --grade-transcript mode to skill_test.py."

